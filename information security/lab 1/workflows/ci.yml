name: Security Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test-and-security-scan:
    name: Tests, SAST and SCA
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Run SpotBugs SAST
        run: mvn --batch-mode --no-transfer-progress compile spotbugs:check

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: |
            target/reports/spotbugs.html
            target/spotbugsXml.xml
          if-no-files-found: warn

      - name: Calculate Dependency-Check cache key
        id: odc-cache-key
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check database
        id: odc-cache
        uses: actions/cache/restore@v6
        with:
          path: .dependency-check-data
          key: odc-${{ runner.os }}-v12-${{ steps.odc-cache-key.outputs.week }}
          restore-keys: |
            odc-${{ runner.os }}-v12-

      - name: Seed or refresh vulnerability database
        if: steps.odc-cache.outputs.cache-hit != 'true'
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:update-only
          -DdataDirectory="${{ github.workspace }}/.dependency-check-data"
          -DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz
          -DnvdValidForHours=24

      - name: Save Dependency-Check database
        if: steps.odc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .dependency-check-data
          key: odc-${{ runner.os }}-v12-${{ steps.odc-cache-key.outputs.week }}

      - name: Run OWASP Dependency-Check SCA
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:check
          -DdataDirectory="${{ github.workspace }}/.dependency-check-data"
          -DautoUpdate=false
          -DfailBuildOnCVSS=7

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-reports
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn

      - name: Build application
        run: mvn --batch-mode --no-transfer-progress package -DskipTests
